<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CazadorADMIN</title>
  <link rel="stylesheet" href="CSS/estilosAdmin.css">
  <script src="https://kit.fontawesome.com/yourkitid.js" crossorigin="anonymous"></script>
</head>

<body class="nuevoProducto">
  <div class="contenedor">
    <aside class="barraLateral">
        <div class="logo">
            <a href="homeAdmin.html" class="logo">Tienda<span>X</span>del<span>X</span>cazador</a>
        </div>
        <nav class="menu">
            <a href="#" class="titulo"> TABLERO DE TRABAJO</a>
            <a href="#"> Productos</a>
            <a href="#">Usuarios</a>
        </nav>
        <div class="perfil">
            <img src="Imagenes/perfilAdmin.jpg" alt="Perfil Admin">
            <a href="#">Perfil</a>
        </div>
    </aside>

    <main class="contenido">
      <header class="barraArriba">
        <h1>AdministradorCazador</h1>
      </header>
    </main>

    
  </div>

  <section class="crearProducto">
        <h2>Nuevo Producto</h2>
        <form id="formularioProducto">
            <label>Código Producto:</label>
            <input type="text" id="codigo" required minlength="3"><br><br>

            <label>Nombre:</label>
            <input type="text" id="nombre" required maxlength="100"><br><br>

            <label>Descripción:</label>
            <textarea id="descripcion" maxlength="500"></textarea><br><br>

            <label>Precio:</label>
            <input type="number" id="precio" min="0" step="0.01" required><br><br>

            <label>Stock:</label>
            <input type="number" id="stock" min="0" step="1" required><br><br>

            <label>Stock Crítico:</label>
            <input type="number" id="stockCritico" min="0" step="1"><br><br>

            <label>Categoría:</label>
            <select id="categoria" required>
                <option value="">Seleccione...</option>
                <option value="Tecnología">hunter x hunter</option>
                <option value="Ropa">jujutsuKaisen</option>
                <option value="Hogar">One Piece</option>
            </select><br><br>

            <label>Imagen (URL):</label>
            <input type="text" id="imagen"><br><br>

            <button type="submit">Guardar Producto</button>
        </form>
    </section>
</body>
</html>
