<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="CSS/estilos.css"/>
    <link href="Js/codigo.js">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <header>    
        <a href="index.html" class="logo">Tienda<span>X</span>del<span>X</span>cazador</a>
        
        <nav class="barra">
            <a href="index.html">Home</a>
            <a href="productos.html" target=_blank>Productos</a>
            <a href="nosotros.html" target=_blank>Nosotros</a>
            <a href="contacto.html" target=_blank>Contacto</a>
        </nav>

        <div class="iconos">
            <a href="#" class="fas fa-search"></a>
            <a href="registro.html" class="fas fa-user"></a>
            <a href="#" class="fas fa-shopping-cart"></a>
        </div>
    </header>
    
    <div class="registro">
        <form action="" method="post" name="Registro" >
            <fieldset>
                <legend>Crear cuenta</legend>
                <label for="nombre">Nombre</label>
                <input type="text" name="nombre" id="nombre" placeholder="Ingrese su nombre" required>
                <label for="correo">Correo electrónico</label>
                <input type="email" name="correo" id="correo" placeholder="Ingrese su correo" required>
                <label for="contraseña">Contraseña</label>
                <input type="password" name="contraseña" id="contraseña" placeholder="Ingrese su contraseña" required><br><br>
                <input type="submit" value="Registrarse">

                
            </fieldset>
        </form>
    </div>
</body>
