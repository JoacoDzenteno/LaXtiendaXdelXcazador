<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiendaXDelXCazador</title>
    <link rel="stylesheet" href="CSS/estilos.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <header>    
        <a href="index.html" class="logo">Tienda<span>X</span>del<span>X</span>cazador</a>
        
        <nav class="barra">
            <a href="index.html">Home</a>
            <a href="productos.html">Productos</a>
            <a href= "nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
            <a href="blogs.html">Blogs</a>
        </nav>

        <div class="iconos">
            <a href="registro.html" class="fas fa-user"></a>
            <a href="#" class="fas fa-shopping-cart">
                <span class="cart-count">0</span>
            </a>
        </div>
    </header>
    
    <div class="registro">
        <form action="" method="post" name="Registro" id="Registro">
            <fieldset>
                <h2>Registro de usuario</h2><br>
                <label for="rut">Rut (sin puntos ni guion)</label>
                <input type="text" name="rut" id="rut" required>
                <label for="nombre">Nombre</label>
                <input type="text" name="nombre" id="nombre" required>
                <label for="apellidos">Apellidos</label>
                <input type="text" name="apellidos" id="apellidos" required>
                <label for="correo">Correo electrónico</label>
                <input type="email" name="correo" id="correo" required>
                <label for="fechaNac">Fecha de nacimiento (opcional)</label><br>
                <input type="date" name="fechaNac" id="fechaNac">
                <label for="contraseña">Contraseña</label>
                <input type="password" name="contraseña" id="contraseña" required>
                <label for="region">Regiones:</label><br>
                <select name="region", id="region">
                    <option value="" required>Seleccione una región</option>
                </select><br><br>
                <label for="comuna">Comunas:</label><br>
                <select name="comuna", id="comuna" disabled>
                    <option value="" required>Seleccione una comuna</option>
                </select><br><br>
                <label for="dirección">Dirección</label>
                <input type="text" name="direccion" id="direccion" required>    
                <input type="submit" value="Registrarse" id="submitRegistro">
            </fieldset>
        </form>
    </div>
    
    <script src="Js/codigo.js" defer></script>
    
</body>
</html>
