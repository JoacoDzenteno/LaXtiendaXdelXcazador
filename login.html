<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiendaXDelXCazador</title>
    <link rel="stylesheet" href="CSS/estilos.css"/>
    <link href="Js/codigo.js">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <header>    
        <a href="index.html" class="logo">Tienda<span>X</span>Del<span>X</span>Cazador</a>
        
        <nav class="barra">
            <a href="index.html">Home</a>
            <a href="productos.html" target=_blank>Productos</a>
            <a href="nosotros.html" target=_blank>Nosotros</a>
            <a href="contacto.html" target=_blank>Contacto</a>
        </nav>

        <div class="iconos">
            <a href="#" class="fas fa-search"></a>
            <a href="registro.html" class="fas fa-user"></a>
            <a href="#" class="fas fa-shopping-cart"></a>
        </div>
    </header>
    <div class="contenido-central">
        <img src="imagenes/LogoTienda.png" alt="LogoTienda" class="logo-titulo">    
        <h1>Tienda del Cazador</h1>
    </div>
    <div class="login">
        <form action="" method="post" name="Login" id="Login">
            <fieldset>
                <h2>Inicio de sesión</h2>
                <label for="correo">Correo electrónico</label>
                <input type="email" name="correo" id="correo" required>
                <label for="contraseña">Contraseña</label>
                <input type="password" name="contraseña" id="contraseña" required>
                <input type="submit" value="Iniciar sesión">
            </fieldset>
        </form>
    </div>
</body>
</html>
